model:
  backbone: "resnet50"
  dropout: 0.3

agent:
  high_threshold: 0.75
  low_threshold:  0.50

data:
  root: "data/raw"

training:
  batch_size:     32
  phase1_epochs:  5
  phase1_lr:      0.001
  phase2_epochs:  20
  phase2_lr:      0.0001
  patience:       5

paths:
  checkpoints: "results/checkpoints/resnet50"
  figures:     "results/figures/resnet50"
  logs:        "results/logs/resnet50"